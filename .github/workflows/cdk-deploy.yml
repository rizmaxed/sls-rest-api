name: CDK Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC authentication with AWS
  contents: read
  pull-requests: read

jobs:
  test-and-diff:
    name: Test & CDK Diff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Authenticate with AWS using OIDC — no long-lived keys stored in secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Run CDK diff so reviewers can see infrastructure changes before approving deploy
      - name: CDK Diff
        run: npx cdk diff SlsRestApiStack

  deploy:
    name: CDK Deploy
    runs-on: ubuntu-latest
    needs: test-and-diff

    # Deploy only on push to main or manual dispatch — never on pull requests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # GitHub Environment approval gate — configure required reviewers in repo settings
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Deploys only after the production environment approval is granted
      - name: CDK Deploy
        run: npx cdk deploy SlsRestApiStack --require-approval never
